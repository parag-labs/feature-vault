<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="850" viewBox="0 0 1560 850" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="850" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">FeatureVault - point-in-time join</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A training row at time T sees only the newest feature value recorded at or before T - never a later one.</text><rect x="50" y="150" width="1460" height="250" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - THE AS-OF JOIN, CONCRETELY</text><rect x="690" y="248" width="616" height="92" rx="9" fill="#fde5e7" fill-opacity="0.55"/><path d="M150,312 H1306" stroke="#8494ab" stroke-width="2.2" fill="none"/><path d="M1320,312 L1305,305 L1305,319 Z" fill="#8494ab"/><text x="152" y="298" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7794">user-1 feature history</text><text x="1300" y="338" text-anchor="end" font-size="12" font-weight="400" fill="#6b7794">time</text><path d="M690,236 V352" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 5"/><text x="690" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17509f">event  T = 150</text><circle cx="520" cy="312" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="2.6"/><circle cx="520" cy="312" r="5.5" fill="#2f9e6e"/><text x="520" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#186547">v = 1.0</text><text x="520" y="338" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7794">t = 100</text><circle cx="860" cy="312" r="8" fill="#e05561" fill-opacity="0.9"/><text x="860" y="284" text-anchor="middle" font-size="13.5" font-weight="400" fill="#9e2b36">v = 2.0</text><text x="860" y="338" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7794">t = 200</text><circle cx="1200" cy="312" r="8" fill="#e05561" fill-opacity="0.9"/><text x="1200" y="284" text-anchor="middle" font-size="13.5" font-weight="400" fill="#9e2b36">v = 3.0</text><text x="1200" y="338" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7794">t = 300</text><rect x="474.936" y="356.0" width="90.128" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="520.0" y="372.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">newest &lt;= T</text><rect x="912.808" y="256.0" width="194.384" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1010" y="272.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">future of T - never returned</text><rect x="50" y="440" width="1460" height="210" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="431" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">2 - HOW IT STAYS CORRECT</text><rect x="69" y="476" width="330" height="150" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(85,491) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></g><text x="115" y="507" font-size="16.5" font-weight="700" fill="#552fae">Sorted + bisect</text><text x="86" y="529.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">bisect_right(T) - 1</text><text x="86" y="546.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">newest value with t &lt;= T</text><text x="86" y="564.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">O(log n) per lookup</text><rect x="433" y="476" width="330" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(449,491) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="479" y="507" font-size="16.5" font-weight="700" fill="#17509f">Lazy sort</text><text x="450" y="529.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ingest appends + marks dirty</text><text x="450" y="546.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sorted on first read</text><text x="450" y="564.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ingest order never matters</text><rect x="797" y="476" width="330" height="150" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(813,491) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="843" y="507" font-size="16.5" font-weight="700" fill="#8c5a0d">Max staleness</text><text x="814" y="529.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">stale if T - t &gt; window</text><text x="814" y="546.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">uses a strict greater-than</text><text x="814" y="564.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">expired returns None</text><rect x="1161" y="476" width="330" height="150" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1177,491) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="1207" y="507" font-size="16.5" font-weight="700" fill="#186547">Build the column</text><text x="1178" y="529.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">as-of join per spine row</text><text x="1178" y="546.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">point-in-time training set</text><text x="1178" y="564.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">get_online = latest value</text><path d="M520.0,382 L520.0,405.0 Q520.0,420 505.0,420.0 L249.0,420.0 Q234,420 234.0,435.0 L234,474" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="316.136" y="408.0" width="111.728" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="372" y="424.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">under the hood</text><rect x="50" y="680" width="720" height="95.19999999999999" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="704" font-size="13.2" font-weight="700" fill="#9e2b36">The invariant: never leak the future</text><text x="66" y="726" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">A row at time T sees the newest value with timestamp &lt;= T, or nothing.</text><text x="66" y="744.4" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">A value exactly at T is present (&lt;=); a row before the first one gets None.</text><text x="66" y="762.8" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">max_staleness is strict: a value exactly one window old still counts.</text><rect x="790" y="680" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="704" font-size="13.2" font-weight="700" fill="#186547">Pinned down and fuzz-checked</text><text x="806" y="726" font-size="12.4" fill="#186547" fill-opacity="0.92">Equal timestamps break ties by (timestamp, value): the largest present wins.</text><text x="806" y="744.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Same answers ingested forward or reversed - order never leaks in.</text><text x="806" y="762.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Thousands of random cases are cross-checked against a brute-force oracle.</text><text x="780.0" y="832" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/feature-vault</text></svg>